# =============================================================================
# Smart EBL - ESPHome Configuration
# =============================================================================
# Central electrical control unit for motorhomes/campervans
# Hardware: ESP32-WROVER-IE-N16R8 with MCP23017 IO expander
# Author: Ingenieurbüro Jan Morawek, Munich
# =============================================================================

substitutions:
  name: smart-ebl
  friendly_name: Smart EBL

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
  on_boot:
    priority: -100  # Runs late, after all components have been set up
    then:
      # LIN control pins (Truma, TJA1021T U14). The SLP_N pin (GPIO27) is NOT
      # handled here - it is the switch "LIN Transceiver Active" further below
      # (restore_mode: ALWAYS_ON), because the TJA1021 only enters Normal mode
      # on a rising edge on SLP_N and must be set very early in setup().
      - output.turn_off: lin_ms # OFF=Slave (Truma CP Plus is the LIN master)
      - output.turn_off: lin_wake # OFF=Normal, ON=Wakeup pulse
      - output.turn_on: can_term # Terminating resistor enabled after boot if ON
      - output.turn_off: can_stb # Transceiver active after boot if OFF

esp32:
  board: esp-wrover-kit
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    advanced:
      # Build warning: "Chip rev >= 3.0 detected. Set minimum_chip_revision:
      # '3.1' ... to reduce binary size". Narrows compiler workarounds to
      # silicon rev 3.1+, which is what recent ESP32-WROVER-IE-N16R8 batches
      # ship. NOTE: if an older board batch with chip rev < 3.1 ever turns
      # up, drop this (or lower the value) - it won't boot on that silicon
      # otherwise. Worth confirming against your actual production batches.
      minimum_chip_revision: "3.1"
      # Build warning: "Bootloader supports SRAM1 as IRAM (+40KB). Set
      # sram1_as_iram: true ...". Frees extra room for code (IRAM) at the
      # cost of that 40KB no longer being available as regular data SRAM -
      # fine here since PSRAM (8MB, WROVER-IE-N16R8) covers the heap.
      sram1_as_iram: true

# Include external basics (wifi, ota, api, etc.)
packages:
  basics: !include .basics.yaml

# =============================================================================
# External Components
# =============================================================================

external_components:
  # Custom ADS7830 8-bit ADC component
  - source:
      type: local
      path: components
    components: [ads7830]

  # Truma iNetbox LIN integration (Smart EBL acts as an "iNet Box" slave on
  # the Truma CP Plus LIN bus). havanti fork of Fabian-Schmidt's
  # esphome-truma_inetbox. It ships its own `uart` component (needed for LIN
  # BREAK detection) which replaces ESPHome's built-in uart for ALL uarts in
  # this config (display_uart too - that is fine and intended).
  # v1.0.32 is required for ESPHome >= 2026.9.0 (v1.0.27 fixed the uart/
  # action build errors with 2026.9, v1.0.23 fixed "uart marked FAILED").
  # See: https://github.com/havanti/esphome-truma
  - source: github://havanti/esphome-truma@v1.0.32
    components: [truma_inetbox, uart]
    refresh: never

# =============================================================================
# I2C Bus Configuration
# =============================================================================
# All ADCs (4x ADS7830) and MCP23017 IO expander share this bus

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 100kHz

# =============================================================================
# MCP23017 IO Expander (U17) - Relay Control
# =============================================================================
# I2C Address: 0x20 (A0=A1=A2=GND)
# GPIO33 = IO_RESET (reset pin), GPIO36 = INT_A, GPIO39 = INT_B
# INT_A and INT_B are not used in this configuration as there are no inputs
# PORT B (GPB0-GPB7) - Relay coil control via ULN2803A:
#   GPB0=P_off, GPB1=P_on, GPB2=L_off, GPB3=L_on,
#   GPB4=A_off, GPB5=A_on, GPB6=12_off, GPB7=12_on
#
# PORT A (GPA0-GPA5) - Additional outputs:
#   GPA0=EisX, GPA1=D+2, GPA2=F-CTRL, GPA3=T1_DC, GPA4=T2_DC, GPA5=T3_DC

mcp23017:
  - id: io_expander
    address: 0x20

output:

  # LIN control pins (TJA1021T U14)
  # GPIO25 = LIN_MS: switches the 1k master pull-up on the LIN line.
  #   Must be OFF (Slave): the Truma CP Plus is the LIN master and already
  #   has its own pull-up.
  - platform: gpio
    id: lin_ms
    pin: GPIO25
    # OFF=Slave, ON=Master
  # GPIO26 = LIN_WAKE: drives the TJA1021 WAKE_N input (active LOW, internal
  #   pull-up to VBAT, so it is driven via a transistor on the board).
  #   Only needed to wake the bus from sleep - keep OFF.
  - platform: gpio
    id: lin_wake
    pin: GPIO26
    # OFF=Normal, ON=Wakeup
  # GPIO27 = LIN_SLP -> see switch "LIN Transceiver Active" (id: lin_slp)

    # CAN Bus Control Pins (via SN65HVD234 U3)
  - platform: gpio
    id: can_term
    pin: GPIO23
    # Terminating resistor enabled after boot if ON
  - platform: gpio
    id: can_stb
    pin: GPIO32
    # Transceiver active after boot if OFF

# =============================================================================
# ADS7830 8-bit ADC Hubs
# =============================================================================

ads7830:
  - id: adc_fuse_group1
    address: 0x48   # U4 - Fuses F1-F8
  - id: adc_fuse_group2
    address: 0x49   # U5 - Fuses F9-F16
  - id: adc_inputs
    address: 0x4A   # U6 - Tank sensors, inputs
  - id: adc_outputs
    address: 0x4B   # U7 - Output monitoring, battery

# =============================================================================
# CAN Bus (RV-C Protocol)
# =============================================================================
# GPIO14 = RXD_CAN1, GPIO15 = TXD_CAN1, GPIO23 = CAN_TERM, GPIO32 = CAN_1_STB

canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO15
    rx_pin: GPIO14
    can_id: 0
    bit_rate: 250kbps

# =============================================================================
# UART Configuration
# =============================================================================

uart:
  # LIN Bus for Truma CP Plus (via TJA1021T U14, RJ12 J10: pin 3 = LIN,
  # pin 5 = GND). Truma LIN runs at 9600 baud, 8N2 - do not change.
  # GPIO12 = TXD1, GPIO13 = RXD1 (not crossed - ESP TX -> TJA1021 TXD)
  - id: lin_uart
    tx_pin: GPIO12
    rx_pin: GPIO13
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 2

  # Display (via TRS3221 RS-232 transceiver U18, RJ45 to display)
  # GPIO18 = TXD2, GPIO19 = RXD2
  # Shared by both display options below - see "Display Connection" section
  - id: display_uart
    tx_pin: GPIO18
    rx_pin: GPIO19
    baud_rate: 115200

# =============================================================================
# Truma iNetbox Integration (LIN bus)
# =============================================================================
# Pieces that belong to the LIN/Truma feature (all enabled):
#   - external_components: havanti/esphome-truma (truma_inetbox + uart)
#   - uart: lin_uart (GPIO12/13, 9600 8N2)
#   - output: lin_ms, lin_wake (+ on_boot turn_off)
#   - switch: lin_slp "LIN Transceiver Active" (TJA1021 SLP_N, GPIO27)
#   - sensor / binary_sensor / climate / number / select: platform truma_inetbox
#
# First commissioning: the CP Plus only assigns LIN slave slots during its
# initialisation. After flashing, run the CP Plus initialisation once
# (CP Plus menu: Service -> RESET -> "PR SET") with the Smart EBL connected,
# otherwise "Truma CP Plus Connected" stays OFF even if the wiring is right.
#
# Troubleshooting (see also havanti TROUBLESHOOTING.md):
#   - Check the SERIAL boot log (USB) - uart setup errors only show there.
#   - No LIN frames in the DEBUG log at all -> transceiver asleep (see
#     lin_slp), wiring, or missing 12V on the TJA1021 (VBAT).
#   - Frames arrive but CP Plus never connects -> lin_checksum / slot (PR SET).

truma_inetbox:
  id: truma
  uart_id: lin_uart
  # LIN 2.x enhanced checksum. VERSION_1 makes the CP Plus drop every frame.
  lin_checksum: VERSION_2
  # Optional: sync the CP Plus clock from Home Assistant. Needs the time
  # component id from .basics.yaml plus an on_time_sync action there:
  #   time:
  #     - platform: homeassistant
  #       id: homeassistant_time
  #       on_time_sync:
  #         then:
  #           - truma_inetbox.clock.set:
  # time_id: homeassistant_time

