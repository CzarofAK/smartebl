  # ---------------------------------------------------------------------------
  # Truma Sensors (LIN bus, truma_inetbox)
  # NOTE: never give a sensor the same name as a number/select - identical
  # names collide in the API and crash the HA connection. Readbacks of
  # settable values therefore get the suffix "Status".
  # ---------------------------------------------------------------------------

  # Current room temperature measured by the CP Plus
  - platform: truma_inetbox
    truma_inetbox_id: truma
    type: CURRENT_ROOM_TEMPERATURE
    name: "Truma Room Temperature"
    id: truma_room_temp

  # Current boiler (water) temperature
  - platform: truma_inetbox
    truma_inetbox_id: truma
    type: CURRENT_WATER_TEMPERATURE
    name: "Truma Water Temperature"
    id: truma_water_temp

  # Truma error code (0 = no error, see Truma manual for codes)
  - platform: truma_inetbox
    truma_inetbox_id: truma
    type: HEATER_ERROR_CODE
    name: "Truma Error Code"
    id: truma_error_code

  # Operating status: 0 off, 1 warning, 4 start-up/run-down,
  # >=5 in operation (exact meaning above 5 depends on the heater model)
  - platform: truma_inetbox
    truma_inetbox_id: truma
    type: OPERATING_STATUS
    name: "Truma Operating Status"
    id: truma_operating_status

  # Readback of the energy mix actually set in the CP Plus
  - platform: truma_inetbox
    truma_inetbox_id: truma
    type: ENERGY_MIX
    name: "Truma Energy Mix Status"
    id: truma_energy_mix_status

  # ---------------------------------------------------------------------------
  # System Diagnostics
  # ---------------------------------------------------------------------------

  - platform: internal_temperature
    name: "ESP32 Temperature"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# =============================================================================
# Binary Sensors
# =============================================================================

binary_sensor:
  # ---------------------------------------------------------------------------
  # Fuse Status (OK when voltage > 1V)
  # ---------------------------------------------------------------------------

  - platform: template
    name: "Fuse F1 OK"
    id: fuse_f1_ok
    lambda: return id(fuse_f1_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F2 OK"
    id: fuse_f2_ok
    lambda: return id(fuse_f2_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F3 OK"
    id: fuse_f3_ok
    lambda: return id(fuse_f3_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F4 OK"
    id: fuse_f4_ok
    lambda: return id(fuse_f4_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F5 OK"
    id: fuse_f5_ok
    lambda: return id(fuse_f5_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F6 OK"
    id: fuse_f6_ok
    lambda: return id(fuse_f6_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F7 OK"
    id: fuse_f7_ok
    lambda: return id(fuse_f7_voltage).state > 1.0;
    device_class: power

  - platform: template
