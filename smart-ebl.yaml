    lambda: return id(fuse_f9_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F10 OK"
    id: fuse_f10_ok
    lambda: return id(fuse_f10_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F11 OK"
    id: fuse_f11_ok
    lambda: return id(fuse_f11_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F12 OK"
    id: fuse_f12_ok
    lambda: return id(fuse_f12_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F13 OK"
    id: fuse_f13_ok
    lambda: return id(fuse_f13_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F14 OK"
    id: fuse_f14_ok
    lambda: return id(fuse_f14_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F15 OK"
    id: fuse_f15_ok
    lambda: return id(fuse_f15_voltage).state > 1.0;
    device_class: power

  - platform: template
    name: "Fuse F16 OK"
    id: fuse_f16_ok
    lambda: return id(fuse_f16_voltage).state > 1.0;
    device_class: power

  # ---------------------------------------------------------------------------
  # Input Detection
  # ---------------------------------------------------------------------------

  - platform: template
    name: "D+ Active"
    id: dplus_active
    lambda: return id(dplus_voltage).state > 6.0;
    device_class: power

  - platform: template
    name: "Shore Power Connected"
    id: shore_power_connected
    lambda: return id(ac_charger_voltage).state > 6.0;
    device_class: plug

  # ---------------------------------------------------------------------------
  # Truma Binary Sensors (LIN bus, truma_inetbox)
  # ---------------------------------------------------------------------------

  # ON as soon as the CP Plus polls the Smart EBL as iNet Box slave.
  # This is THE indicator whether the LIN link works at all.
  - platform: truma_inetbox
    truma_inetbox_id: truma
    type: CP_PLUS_CONNECTED
    name: "Truma CP Plus Connected"
    id: truma_connected

  - platform: truma_inetbox
    truma_inetbox_id: truma
    type: HEATER_HAS_ERROR
    name: "Truma Has Error"
    id: truma_has_error

  # Room heating / boiler switched on in the CP Plus (setpoint active, not
  # necessarily burner running - use Operating Status for that)
  - platform: truma_inetbox
    truma_inetbox_id: truma
    type: HEATER_ROOM
    name: "Truma Room Heater Active"
    id: truma_room_heater_active

  - platform: truma_inetbox
    truma_inetbox_id: truma
    type: HEATER_WATER
    name: "Truma Water Heater Active"
    id: truma_water_heater_active


# =============================================================================
# Switches - MCP23017 Controlled Relays
# =============================================================================

switch:
  # ---------------------------------------------------------------------------
  # LIN Transceiver Sleep Control (TJA1021T U14, pin SLP_N <- GPIO27 LIN_SLP)
  # ---------------------------------------------------------------------------
  # The TJA1021 powers up in "Power-on/Sleep" mode with transmitter AND
  # receiver disabled. It only enters Normal mode on a RISING edge on SLP_N
  # (active LOW, internal pull-down). Before this fix LIN_SLP was driven LOW
  # ("OFF=Normal") -> the transceiver never left sleep -> no LIN traffic at
  # all, CP Plus never saw the Smart EBL.
  # ALWAYS_ON: GPIO27 goes HIGH during setup -> rising edge -> Normal mode.
  # Exposed as a config switch so it can be toggled from HA for diagnosis:
  # ON = transceiver active (Normal), OFF = sleep.
  # If the board ever turns out to have an inverting transistor in front of
  # SLP_N (i.e. LIN only works with this switch OFF), set `inverted: true`
  # on the pin instead of changing restore_mode.
  - platform: gpio
    id: lin_slp
    name: "LIN Transceiver Active"
    icon: mdi:lan-connect
    entity_category: config
    pin: GPIO27
    restore_mode: ALWAYS_ON

  # ---------------------------------------------------------------------------
  # Internal MCP23017 Pin Outputs (coil drivers via ULN2803A)
  # Bistable relays need a pulse to change state
  # PIN MAPPING FROM information/I2C overview:
  #   PORT B (pins 8-15): Relay coils
  #     GPB0(8)=P_off, GPB1(9)=P_on, GPB2(10)=L_off, GPB3(11)=L_on
  #     GPB4(12)=A_off, GPB5(13)=A_on, GPB6(14)=12_off, GPB7(15)=12_on
  #   PORT A (pins 0-7): Additional outputs
  #     GPA0(0)=EisX, GPA1(1)=D+2, GPA2(2)=F-CTRL
  #     GPA3(3)=T1_DC, GPA4(4)=T2_DC, GPA5(5)=T3_DC
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Relay Coils MCP23017 Outputs (GPB0-GPB5)
  # ---------------------------------------------------------------------------

  # Pump relay coils (GPB0=OFF, GPB1=ON)
  - platform: gpio
    id: relay_pump_off_coil
    pin:
      mcp23xxx: io_expander
      number: 8  # GPB0 = P_off
      mode: OUTPUT
    internal: true
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: relay_pump_off_coil

  - platform: gpio
    id: relay_pump_on_coil
    pin:
      mcp23xxx: io_expander
      number: 9  # GPB1 = P_on
      mode: OUTPUT
    internal: true
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: relay_pump_on_coil

  # Light Group relay coils (GPB2=OFF, GPB3=ON)
  - platform: gpio
    id: relay_light_off_coil
    pin:
      mcp23xxx: io_expander
      number: 10  # GPB2 = L_off
      mode: OUTPUT
    internal: true
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: relay_light_off_coil

  - platform: gpio
    id: relay_light_on_coil
    pin:
      mcp23xxx: io_expander
      number: 11  # GPB3 = L_on
      mode: OUTPUT
    internal: true
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: relay_light_on_coil

  # AUX Group relay coils (GPB4=OFF, GPB5=ON)
  - platform: gpio
    id: relay_aux_off_coil
    pin:
      mcp23xxx: io_expander
      number: 12  # GPB4 = A_off
      mode: OUTPUT
    internal: true
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: relay_aux_off_coil

  - platform: gpio
    id: relay_aux_on_coil
    pin:
      mcp23xxx: io_expander
      number: 13  # GPB5 = A_on
      mode: OUTPUT
    internal: true
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: relay_aux_on_coil

  # 12V Group relay coils (GPB6=OFF, GPB7=ON)
  - platform: gpio
    id: relay_12v_off_coil
    pin:
      mcp23xxx: io_expander
      number: 14  # GPB6 = 12_off
      mode: OUTPUT
    internal: true
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: relay_12v_off_coil

  - platform: gpio
    id: relay_12v_on_coil
    pin:
      mcp23xxx: io_expander
      number: 15  # GPB7 = 12_on
      mode: OUTPUT
    internal: true
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: relay_12v_on_coil

  # ---------------------------------------------------------------------------
  # Additional MCP23017 Outputs (GPA0-GPA5)
  # ---------------------------------------------------------------------------

  # EisEx heater control (GPA0)
  - platform: gpio
    id: eisex_output
    name: "EisEx Heater"
    icon: mdi:heating-coil
    pin:
      mcp23xxx: io_expander
      number: 0  # GPA0 = EisX
      mode: OUTPUT

  # D+2 Relay control (GPA1)
  - platform: gpio
    id: dplus_relay
    name: "D+2 Relay"
    icon: mdi:car-battery
    pin:
      mcp23xxx: io_expander
      number: 1  # GPA1 = D+2
      mode: OUTPUT

  # Fridge control (GPA2)
  - platform: gpio
    id: fridge_control
    name: "Fridge Control"
    icon: mdi:fridge
    pin:
      mcp23xxx: io_expander
      number: 2  # GPA2 = F-CTRL
      mode: OUTPUT

  # Tank DC mode controls (GPA3-GPA5)
  # These inhibit tank readings while driving/moving
  - platform: gpio
    id: tank1_dc_control
    name: "Tank 1 Control"
    icon: mdi:water
    pin:
      mcp23xxx: io_expander
      number: 3  # GPA3 = T1_DC
      mode: OUTPUT

  - platform: gpio
    id: tank2_dc_control
    name: "Tank 2 Control"
    icon: mdi:water
    pin:
      mcp23xxx: io_expander
      number: 4  # GPA4 = T2_DC
      mode: OUTPUT

  - platform: gpio
    id: tank3_dc_control
    name: "Tank 3 Control"
    icon: mdi:water
    pin:
      mcp23xxx: io_expander
      number: 5  # GPA5 = T3_DC
      mode: OUTPUT

  # ---------------------------------------------------------------------------
  # User-Facing Template Switches (for Home Assistant)
  # ---------------------------------------------------------------------------

  # Water Pump
  - platform: template
    name: "Water Pump"
    id: switch_pump
    icon: mdi:water-pump
    optimistic: true
    turn_on_action:
      - switch.turn_on: relay_pump_on_coil
    turn_off_action:
      - switch.turn_on: relay_pump_off_coil

  # Light Group
  - platform: template
    name: "Light Group"
    id: switch_light
    icon: mdi:lightbulb-group
    optimistic: true
    turn_on_action:
      - switch.turn_on: relay_light_on_coil
    turn_off_action:
      - switch.turn_on: relay_light_off_coil

  # 12V Group
  - platform: template
    name: "12V Group"
    id: switch_12v
    icon: mdi:power-socket-eu
    optimistic: true
    turn_on_action:
      - switch.turn_on: relay_12v_on_coil
    turn_off_action:
      - switch.turn_on: relay_12v_off_coil

  # AUX Group
  - platform: template
    name: "AUX Group"
    id: switch_aux
    icon: mdi:power
    optimistic: true
    turn_on_action:
      - switch.turn_on: relay_aux_on_coil
    turn_off_action:
      - switch.turn_on: relay_aux_off_coil

# =============================================================================
# Climate - Truma Heater (LIN bus, truma_inetbox)
# =============================================================================

climate:
  # Room heating: HVAC mode heat/off + target room temperature (5-30 °C)
  # -> climate.smart_ebl_truma_heater (used by lovelace-smartebl.yaml)
  - platform: truma_inetbox
    truma_inetbox_id: truma
    type: ROOM
    name: "Truma Heater"
