  - platform: ads7830
    ads7830_id: adc_fuse_group1
    channel: 7
    name: "Fuse F1 Voltage"
    id: fuse_f1_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 5s
    filters:
      - multiply: 6.62  # Voltage divider calibration

